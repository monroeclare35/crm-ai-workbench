[project]
name = "crm-ai-workbench"
version = "0.3.0"
description = "CRM AI 智能工作台 — 基于 Claude Agent SDK 的 AI Native 商业销售平台"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "CRM AI Team" }
]

dependencies = [
    # Claude Agent SDK — 核心引擎
    "claude-agent-sdk>=0.17.0",

    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",

    # 异步支持
    "anyio>=4.6.0",
    "httpx>=0.28.0",

    # 数据
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",

    # 向量检索 & RAG
    "pymilvus>=2.5.0",
    "elasticsearch>=8.17.0",

    # 缓存 & 消息队列
    "redis>=5.2.0",
    "celery>=5.4.0",

    # 工具
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
